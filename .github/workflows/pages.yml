# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # install mdbook
      - name: mdbook Cache
        id: mdbook_cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook

      - name: Install `mdbook`
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: latest

      # install mdslides
      - name: mdslides Cache
        id: mdslides_cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdslides
          key: ${{ runner.os }}-mdslides

      - name: "Install `mdslides`"
        run: cargo install mdslides
        if: steps.mdslides_cache.outputs.cache-hit != 'true'

      # Build slides
      - name: Build slides
        run: ./build.sh

      # Hack: Replace mdslides generated index.html with the slides
      - name: Replace index.html
        run: cp html/slides.html html/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "html/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
