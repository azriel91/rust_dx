<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui"
        />
        <!-- bundled css -->
        <link rel="stylesheet" href="css/reveal_reset.css" />
        <link rel="stylesheet" href="css/reveal.css" />
        <link rel="stylesheet" href="css/theme/simple.css" id="theme" />
        <link rel="stylesheet" href="css/styles/github.min.css" />
        <!--
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/reset.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/reveal.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/theme/simple.css"
            id="theme"
        />
        -->
        <!-- This is the highlight.js theme bundled in reveal.js -->
        <!-- link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/plugin/highlight/monokai.css" -->
        <!-- This is the theme we prefer, which we take from highlight.js directly -->
        <!--
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css"
        />
        -->
        <title>$TITLE</title>
        <style>
            .hidden {
                display: none;
            }
            .reveal .eq_centre table td {
                text-align: center;
                font-size: 0.9em;
            }
            .reveal {
                --r-heading-font: Arial, Helvetica, sans-serif;
            }
            .open-in-playground {
                background: #2a4;
                font-size: 100%;
                color: white;
                font-weight: 700;
                cursor: pointer;
                float: left;
            }

            .reveal h1 {
                font-size: 2em;
                font-weight: 700;
            }

            .reveal h2 {
                font-size: 1.5em;
                font-weight: 700;
            }

            .reveal h3 {
                font-size: 1.5em;
                font-weight: 700;
            }

            .reveal h2 code {
                font-size: 80%;
            }

            .reveal code {
                /* inline code using backticks */
                background: #f0f0f0;
                border-radius: 4px;
            }

            .reveal pre:has(code.fit) {
                width: fit-content;
            }

            .reveal pre code {
                /* multi-line code blocks using triple backticks */
                /* background: #000000; */
                border-radius: 4px;
                font-size: 1.2em;
                line-height: 1.3;
            }

            .reveal blockquote {
                background: #eee;
            }

            .reveal blockquote p::before {
                content: open-quote;
            }

            .reveal blockquote p::after {
                content: close-quote;
            }

            .branding {
                height: 7%;
                position: absolute;
                margin-top: 1em;
                margin-left: 1em;
                z-index: 10;
            }

            .reveal blockquote {
                width: 85%;
            }

            .reveal .branding__logo {
                height: 150px;
                margin: 0;
            }

            .columns {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
            }

            .scrollable-slide {
                height: 720px;
                overflow-y: auto !important;
            }

            pre code .b {
                font-weight: bold;
            }

            pre code .er {
                font-weight: bold;
                color: #f15d22;
            }

            pre code .eb {
                font-weight: bold;
                color: #48b9c7;
            }

            pre code .eg {
                font-weight: bold;
                color: #73c48f;
            }
            pre code .help {
                font-weight: bold;
                color: #00ffff;
            }

            .two_col_container {
                display: flex;
                justify-content: space-between;
            }

            .two_col_container .col {
                flex: 1;
            }

            /* Blue highlight ring around the focused element */
            .focus_highlight {
                border-radius: 4px;
                outline: 4px solid #2299ff;
                outline-offset: 2px;
            }

            .focus_highlight_soft {
                border-radius: 4px;
                outline: 4px solid #2299ff1f;
                background-color: #2299ff1f;
            }

            /* to-html classes */
            .terminal {
                background-color: black;
                border-radius: 4px;
                padding: 20px;
                color: white;
                overflow: scroll;

                --bright-cyan: #99ccff;
                --bright-green: #55ff99;
                --r-selection-background-color: #334466;
            }
        </style>
    </head>

    <body>
        <div class="reveal">
            <div class="slides">
                <section
                    data-markdown
                    data-separator-vertical="^<!-- --- -->"
                    data-separator-notes="^#### Notes"
                >
                    <textarea data-template>
$CONTENT
                    </textarea>
                </section>
            </div>
            <!-- class="slides" -->
            <div class="branding">
                <a href="./index.html">
                    <img
                        class="branding__logo"
                        src="./dove.svg"
                        alt="The Peace logo. A dove facing head-on, white with a slight shade of blue, coming through a dark-grey storm cloud."
                    />
                </a>
            </div>
        </div>
        <!-- class="reveal" -->

        <!-- Bundled scripts -->
        <script src="js/reveal.js"></script>
        <script src="js/notes.min.js"></script>
        <script src="js/markdown.min.js"></script>
        <script src="js/reveal_highlight.min.js"></script>
        <script src="js/highlight.min.js"></script>
        <script src="js/jquery-3.6.4.min.js"></script>

        <!--
        <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/reveal.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/plugin/notes/notes.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/plugin/markdown/markdown.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/plugin/highlight/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.4.min.js" crossorigin="anonymous"></script>
        -->
        <script>
            const buttons = '<p><button class="open-in-playground">Run</button></p>\n';

            function addButtons() {
                $("pre code.rust:not(.fragment):not(.ignore)").each(function (i, block) {
                    $(block).parent().append(buttons);
                });
                $(".open-in-playground").click(function () {
                    const baseUrl = "https://play.rust-lang.org/?version=stable&edition=2018&code=";
                    const code = $(this).parent().parent().children("code")[0].cloneNode(true);
                    var payload;
                    const content = code.firstChild;
                    if (content.tagName == "TABLE") {
                        // We have line numbers
                        var source = "";
                        for (let row of content.rows) {
                            // Source is in the second column. The first column is line numbers.
                            source += row.cells[1].innerText + "\n";
                        }
                        payload = encodeURIComponent(source);
                    } else {
                        // We do not have line numbers
                        payload = encodeURIComponent(code.innerText);
                    }
                    const url = baseUrl + payload;
                    window.open(url, "_blank");
                });
            }

            $(document).ready(function () {
                // More info about config & dependencies:
                // - https://github.com/hakimel/reveal.js#configuration
                // - https://github.com/hakimel/reveal.js#dependencies
                Reveal.initialize({
                    // Display presentation control arrows
                    controls: true,
                    // Help the user learn the controls by providing hints, for example by
                    // bouncing the down arrow when they first encounter a vertical slide
                    controlsTutorial: true,
                    // Determines where controls appear, "edges" or "bottom-right"
                    controlsLayout: "bottom-right",
                    // Visibility rule for backwards navigation arrows; "faded", "hidden"
                    // or "visible"
                    controlsBackArrows: "faded",
                    // Display a presentation progress bar
                    progress: true,
                    // Display the page number of the current slide
                    slideNumber: true,
                    // Control which views the slide number displays on
                    showSlideNumber: "all",
                    // Add the current slide number to the URL hash so that reloading the
                    // page/copying the URL will return you to the same slide
                    hash: true,
                    // Push each slide change to the browser history. Implies `hash: true`
                    history: false,
                    // Enable keyboard shortcuts for navigation
                    keyboard: true,
                    // Enable the slide overview mode
                    overview: true,
                    // Disables the default reveal.js slide layout so that you can use custom CSS layout
                    disableLayout: false,
                    // Vertical centering of slides
                    center: true,
                    // Enables touch navigation on devices with touch input
                    touch: true,
                    // Loop the presentation
                    loop: false,
                    // Change the presentation direction to be RTL
                    rtl: false,
                    // See https://revealjs.com/config/
                    navigationMode: "default",
                    // Randomizes the order of slides each time the presentation loads
                    shuffle: false,
                    // Turns fragments on and off globally
                    fragments: true,
                    // Flags whether to include the current fragment in the URL,
                    // so that reloading brings you to the same fragment position
                    fragmentInURL: false,
                    // Flags if the presentation is running in an embedded mode,
                    // i.e. contained within a limited portion of the screen
                    embedded: false,
                    // Flags if we should show a help overlay when the questionmark
                    // key is pressed
                    help: true,
                    // Flags if speaker notes should be visible to all viewers
                    showNotes: false,
                    // Global override for autolaying embedded media (video/audio/iframe)
                    // - null: Media will only autoplay if data-autoplay is present
                    // - true: All media will autoplay, regardless of individual setting
                    // - false: No media will autoplay, regardless of individual setting
                    autoPlayMedia: null,
                    // Global override for preloading lazy-loaded iframes
                    // - null: Iframes with data-src AND data-preload will be loaded when within
                    //   the viewDistance, iframes with only data-src will be loaded when visible
                    // - true: All iframes with data-src will be loaded when within the viewDistance
                    // - false: All iframes with data-src will be loaded only when visible
                    preloadIframes: null,
                    // Number of milliseconds between automatically proceeding to the
                    // next slide, disabled when set to 0, this value can be overwritten
                    // by using a data-autoslide attribute on your slides
                    autoSlide: 0,
                    // Stop auto-sliding after user input
                    autoSlideStoppable: true,
                    // Use this method for navigation when auto-sliding
                    autoSlideMethod: Reveal.navigateNext,
                    // Specify the average time in seconds that you think you will spend
                    // presenting each slide. This is used to show a pacing timer in the
                    // speaker view
                    defaultTiming: 60,
                    // Specify the total time in seconds that is available to
                    // present.  If this is set to a nonzero value, the pacing
                    // timer will work out the time available for each slide,
                    // instead of using the defaultTiming value
                    // Set to 30 minutes.
                    totalTime: 1800,
                    // Specify the minimum amount of time you want to allot to
                    // each slide, if using the totalTime calculation method.  If
                    // the automated time allocation causes slide pacing to fall
                    // below this threshold, then you will see an alert in the
                    // speaker notes window
                    minimumTimePerSlide: 0,
                    // Enable slide navigation via mouse wheel
                    mouseWheel: false,
                    // Hide cursor if inactive
                    hideInactiveCursor: true,
                    // Time before the cursor is hidden (in ms)
                    hideCursorTime: 5000,
                    // Hides the address bar on mobile devices
                    hideAddressBar: true,
                    // Opens links in an iframe preview overlay
                    // Add `data-preview-link` and `data-preview-link="false"` to customise each link
                    // individually
                    previewLinks: false,
                    // Transition style (e.g., none, fade, slide, convex, concave, zoom)
                    transition: "none",
                    // Transition speed (e.g., default, fast, slow)
                    transitionSpeed: "default",
                    // Transition style for full page slide backgrounds (e.g., none, fade, slide, convex, concave, zoom)
                    backgroundTransition: "fade",
                    // Number of slides away from the current that are visible
                    viewDistance: 3,
                    // Number of slides away from the current that are visible on mobile
                    // devices. It is advisable to set this to a lower number than
                    // viewDistance in order to save resources.
                    mobileViewDistance: 3,
                    // Parallax background image (e.g., "'https://s3.amazonaws.com/hakim-static/reveal-js/reveal-parallax-1.jpg'")
                    parallaxBackgroundImage: "",
                    // Parallax background size in CSS syntax (e.g., "2100px 900px")
                    parallaxBackgroundSize: "",
                    // Number of pixels to move the parallax background per slide
                    // - Calculated automatically unless specified
                    // - Set to 0 to disable movement along an axis
                    parallaxBackgroundHorizontal: null,
                    parallaxBackgroundVertical: null,
                    // The display mode that will be used to show slides
                    display: "block",

                    // The "normal" size of the presentation, aspect ratio will be preserved
                    // when the presentation is scaled to fit different resolutions. Can be
                    // specified using percentage units.
                    width: 1280,
                    height: 720,

                    // Factor of the display size that should remain empty around the content
                    margin: 0.1,

                    // Bounds for smallest/largest possible scale to apply to content
                    minScale: 0.2,
                    maxScale: 1.5,

                    // PDF Export Options
                    // Put each fragment on a separate page
                    pdfSeparateFragments: true,
                    // For slides that do not fit on a page, max number of pages
                    pdfMaxPagesPerSlide: 1,

                    highlight: {
                        highlightOnLoad: false,
                    },

                    plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
                }).then(() => {
                    addButtons();

                    const highlight = Reveal.getPlugin("highlight");
                    $("pre code.rust").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.java").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.cs").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.rb").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.diff").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.js").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.md").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.sh").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.bash").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.console").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.wat").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.c").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.toml").each(function (i, el) {
                        highlight.highlightBlock(el);
                    });
                    $("pre code.mermaid").each(function (i, el) {
                        // Center the mermaid diagrams.
                        el.style.cssText += "text-align: center";
                    });
                });

                function resetSlideScrolling(slide) {
                    $(slide).removeClass("scrollable-slide");
                }

                function handleSlideScrolling(slide) {
                    if ($(slide).height() >= 720) {
                        $(slide).addClass("scrollable-slide");
                    }
                }

                Reveal.addEventListener("ready", function (event) {
                    handleSlideScrolling(event.currentSlide);
                });

                Reveal.addEventListener("slidechanged", function (event) {
                    resetSlideScrolling(event.previousSlide);
                    handleSlideScrolling(event.currentSlide);
                });
            });
        </script>
    </body>
</html>
